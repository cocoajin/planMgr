name: Build PlanMgr 1.0.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
            archive: planMgr-go-darwin-arm64.zip
          - target: linux-arm64
            runner: ubuntu-22.04
            archive: planMgr-go-linux-arm64.tar.gz
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify
      - name: Test on build host
        run: go test ./...
      - name: Check version
        run: test "$(go run . --version)" = "1.0.0"
      - name: Build installation package
        run: python3 scripts/build.py --target "${{ matrix.target }}"
      - name: Verify package checksum
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS
      - name: Upload installation package
        uses: actions/upload-artifact@v4
        with:
          name: planMgr-1.0.0-${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download installation packages
        uses: actions/download-artifact@v5
        with:
          pattern: planMgr-1.0.0-*
          path: release-assets
          merge-multiple: true

      - name: Generate and verify checksums
        working-directory: release-assets
        run: |
          test -f planMgr-go-darwin-arm64.zip
          test -f planMgr-go-linux-arm64.tar.gz
          sha256sum planMgr-go-darwin-arm64.zip planMgr-go-linux-arm64.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: 1.0.0
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "PlanMgr 1.0.0" \
              --generate-notes
          fi
